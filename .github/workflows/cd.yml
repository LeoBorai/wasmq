name: Continuous Delivery

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        required: true
        description: 'Version number to bump'
        options:
          - patch
          - minor
          - major
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-binaries:
    name: Build binaries
    strategy:
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Cargo Binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Rust Binaries
        run: cargo binstall -y --force cargo-tag

      - name: Retrieve Git Commit SHA
        run: echo "GIT_COMMIT_SHA7=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_ENV

      - name: Retrieve Version
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "CRATE_VERSION=$(cargo tag --no-tag --no-commit -p=v ${{ inputs.version }})" >> $GITHUB_ENV
          else
            echo "CRATE_VERSION=$(cargo tag --no-tag --no-commit -p=v prerelease pre.$GIT_COMMIT_SHA7)" >> $GITHUB_ENV
          fi

      - name: Build for ARM64 Linux GNU
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          cargo build --release --target ${{ matrix.target }}

      - name: Build binary
        if: ${{ matrix.target != 'aarch64-unknown-linux-gnu' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          # Create binary name with version and target
          BINARY_NAME="wasmq-${{ env.CRATE_VERSION }}-${{ matrix.name }}"

          # Copy and rename binary
          if [ "${{ matrix.os }}" == "ubuntu-latest" ] || [ "${{ matrix.os }}" == "macos-latest" ]; then
            cp target/${{ matrix.target }}/release/wasmq $BINARY_NAME
          fi

          # Create tar.gz archive
          tar -czf $BINARY_NAME.tar.gz $BINARY_NAME

          # Store artifact name for later use
          echo "ARTIFACT_NAME=$BINARY_NAME.tar.gz" >> $GITHUB_ENV

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}

  release:
    name: Create Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Cargo Binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Rust Binaries
        run: cargo binstall -y --force cargo-tag

      - name: Retrieve Git Commit SHA
        run: echo "GIT_COMMIT_SHA7=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_ENV

      - name: Commit Version Bump
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "CRATE_VERSION=$(cargo tag -p=v ${{ inputs.version }})" >> $GITHUB_ENV
          else
            echo "CRATE_VERSION=$(cargo tag -p=v prerelease pre.$GIT_COMMIT_SHA7)" >> $GITHUB_ENV
          fi
          git push origin main --follow-tags

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Determine if this is a pre-release
          IS_PRERELEASE=""
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            IS_PRERELEASE="--prerelease"
          fi

          # Create the release
          gh release create "${{ env.CRATE_VERSION }}" \
            --title "${{ env.CRATE_VERSION }}" \
            --generate-notes \
            $IS_PRERELEASE

          # Upload all binary artifacts
          for artifact_dir in ./artifacts/*/; do
            if [ -d "$artifact_dir" ]; then
              for file in "$artifact_dir"*.tar.gz; do
                if [ -f "$file" ]; then
                  echo "Uploading $(basename "$file")"
                  gh release upload "${{ env.CRATE_VERSION }}" "$file"
                fi
              done
            fi
          done

  docker:
    name: Publish Docker Image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Git Fetch Unshallow
        run: git fetch --prune --unshallow

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Rust Target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.12.0

      - name: Setup Cargo Binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Setup Binaries
        run: |
          cargo binstall -y --force cargo-tag
          cargo binstall -y --force cargo-zigbuild
          cargo binstall -y --force just

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install \
            pkg-config \
            libssl-dev

      - name: Build Image
        run: just docker-build-image

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Image to GitHub Container Registry
        run: just docker-publish-image

  docs:
    name: Publish Docs
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Cargo Binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Setup Binaries
        run: |
          cargo binstall -y --force just
          cargo binstall -y --force mdbook

      - name: Build static files
        run: just docs-build

      # https://github.com/actions/upload-pages-artifact
      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

      # https://github.com/actions/deploy-pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
