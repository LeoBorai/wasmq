[package]
name = "wasmq-cli"
edition.workspace = true
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true

[[bin]]
name = "wasmq"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
bytes = { workspace = true }
chrono = { workspace = true }
humantime = { workspace = true }
clap = { workspace = true, features = ["env", "derive", "std"] }
include_dir = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tabled = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ulid = { workspace = true }

wasmq = { workspace = true }
wasmq-config = { workspace = true }
wasmq-executor = { workspace = true }
wasmq-ipc = { workspace = true }
wasmq-repository = { workspace = true }
wasmq-scheduler = { workspace = true }
wasmq-storage = { workspace = true }
