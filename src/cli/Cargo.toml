[package]
name = "mate-cli"
edition.workspace = true
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true

[[bin]]
name = "mate"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
bytes = { workspace = true }
chrono = { workspace = true }
humantime = { workspace = true }
clap = { workspace = true, features = ["env", "derive", "std"] }
include_dir = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tabled = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4"] }

mate = { workspace = true }
mate-config = { workspace = true }
mate-executor = { workspace = true }
mate-ipc = { workspace = true }
mate-repository = { workspace = true }
mate-scheduler = { workspace = true }
mate-storage = { workspace = true }
