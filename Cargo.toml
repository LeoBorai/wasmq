[workspace]
members = ["./src/*", "./task/*"]
default-members = ["src/cli"]
resolver = "3"

[workspace.package]
authors = ["Leo Borai <estebanborai@gmail.com>"]
version = "0.0.0-pre.1d5020a"
edition = "2024"
categories = ["web-programming"]
description = "🦀🧡🧉"
documentation = "https://docs.rs/mate"
keywords = ["job", "queue", "scheduler", "wasm"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/LeoBorai/mate"
readme = "./README.md"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
bytes = "1.11"
chrono = "0.4"
clap = "4.6"
humantime = "2.3"
include_dir = "0.7"
log = "0.4"
proc-macro2 = "1.0"
reqwest = "0.13"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = "0.8.6"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
tabled = "0.20"
tempfile = "3.27"
tokio = "1"
toml = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = "1.23"
wasmtime = "43.0"
wasmtime-wasi = "43.0"
wasmtime-wasi-http = "43.0"
wit-bindgen = "0.56"
wstd = "0.6"

mate-config = { path = "./src/config" }
mate-executor = { path = "./src/executor" }
mate-ipc = { path = "./src/ipc" }
mate = { path = "./src/mate" }
mate-repository = { path = "./src/repository" }
mate-scheduler = { path = "./src/scheduler" }
mate-storage = { path = "./src/storage" }
mate-task = { path = "./src/task" }
